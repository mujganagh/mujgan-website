<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Mujgan Aghazada</title>
  <meta name="description" content="Writing by Mujgan Aghazada." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Blog | Mujgan Aghazada" />
  <meta property="og:description" content="Writing by Mujgan Aghazada." />
  <meta property="og:url" content="https://mujganagh.com/blog/" />
  <meta property="og:site_name" content="Mujgan Aghazada" />
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- 1) Set theme class ASAP -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
    })();
  </script>

  <!-- 2) Tailwind CDN with preflight disabled (avoid late resets) -->
  <script>
    window.tailwind = { config: { corePlugins: { preflight: false } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 3) (Optional) Inter with minimal reflow -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=optional"
        onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=optional">
  </noscript>

  <!-- 4) Shared theme tokens + pill styles -->
  <link rel="stylesheet" href="/assets/theme.css">

  <style>
    /* Base stack + stabilizers */
    html, body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size-adjust: 0.52;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-weight: 300;
      font-size: 18px;
      line-height: 1.75;
      letter-spacing: -0.01em;
    }

    /* Top nav */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      padding: 1.15rem 2rem;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    nav .logo {
      font-weight: 500;
      color: var(--accent-color);
      letter-spacing: -0.02em;
    }

    nav a {
      color: var(--text-color);
      margin-left: 1.25rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover {
      color: var(--accent-color);
    }

    nav a.active {
      color: var(--accent-color);
      font-weight: 500;
    }

    main { max-width: 700px; margin: 0 auto; padding: 2.75rem 2rem 3.25rem; }

    h1 {
      font-size: 1.75rem;
      font-weight: 500;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
      color: var(--text-color);
      text-underline-offset: 4px;
      text-decoration-color: var(--border-color);
    }

    /* Post list styles (theme-aware) */
    .post {
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1.25rem 1rem;
      transition: background-color .2s ease;
    }
    .post:hover { background: var(--hover); }
    .post time {
      display: block;
      font-size: 0.875rem;
      color: var(--muted-color);
      margin-bottom: .5rem;
    }
    .post-title {
      display: inline-block;
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--link-color);
      text-decoration: none;
      margin-bottom: .35rem;
    }
    .post-title:hover { text-decoration: underline; }
    .post-excerpt { margin: 0; color: var(--text-color); }

    /* Small helpers (replacing Tailwind utilities used in content) */
    .mb-8 { margin-bottom: 2rem; }
    .space-y-4 > * + * { margin-top: 1rem; }

    @media (max-width: 520px) {
      nav { padding: 1rem 1.25rem; font-size: 15px; }
      nav a { margin-left: 1rem; }
      main { padding: 2.25rem 1.25rem 2.75rem; }
      body { font-size: 17px; line-height: 1.8; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Mujgan Aghazada</div>
    <div>
      <a href="/">about</a>
      <a href="/projects/">projects</a>
      <a href="/photos/">film photos</a>
      <a href="/blog/">blog</a>
    </div>
  </nav>
  <script>
    (function() {
      var path = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
      document.querySelectorAll('nav a').forEach(function(a) {
        var href = a.getAttribute('href').endsWith('/') ? a.getAttribute('href') : a.getAttribute('href') + '/';
        if (path === href) a.classList.add('active');
      });
    })();
  </script>

  <main>
    <h1>blog</h1>
    <p class="mb-8" style="color: var(--muted-color);">word vomit!</p>

    <!-- Blog post list rendered dynamically -->
    <div id="blog-list" class="space-y-4"></div>
  </main>

  <script>
    // Fetch posts; if your posts.json lives at /blog/posts.json, this path is correct
    fetch('posts.json')
      .then(r => {
        if (!r.ok) throw new Error('Failed to load posts.json');
        return r.json();
      })
      .then(posts => {
        const container = document.getElementById('blog-list');

        // Sort newest first if you like (remove if your JSON is already ordered)
        const visible = posts.filter(p => !p.hidden);
        visible.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

        if (visible.length === 0) {
          container.innerHTML = '<p style="color: var(--muted-color);">under construction — check back soon.</p>';
          return;
        }

        visible.forEach(post => {
          // Expected keys: title, date (yyyy-mm-dd or readable), link, excerpt
          const link = post.link || '#';
          const title = post.title || 'Untitled';
          const dateISO = post.date || '';
          const dateText = post.date_text || post.date || '';
          const excerpt = post.excerpt || '';

          const el = document.createElement('article');
          el.className = 'post';

          el.innerHTML = `
            <time ${dateISO ? `datetime="${dateISO}"` : ''}>${dateText}</time>
            <a class="post-title" href="${link}">${title} →</a>
            ${excerpt ? `<p class="post-excerpt">${excerpt}</p>` : ''}
          `;

          container.appendChild(el);
        });
      })
      .catch(err => {
        const container = document.getElementById('blog-list');
        container.innerHTML = '<p style="color: var(--muted-color);">couldn’t load posts right now.</p>';
        console.error(err);
      });
  </script>

  <!-- Shared theme logic (injects the bottom-right toggle if missing) -->
  <script src="/assets/theme.js"></script>
</body>
</html>
