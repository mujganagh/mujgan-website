  <!-- 1) set theme class ASAP -->
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.add(theme === 'dark' ? 'dark-theme' : 'light-theme');
    })();
  </script>

  <!-- 2) Tailwind CDN with preflight disabled -->
  <script>
    window.tailwind = { config: { corePlugins: { preflight: false } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 3) Inter webfont -->

  <style>
    html, body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size-adjust: 0.52;
      -webkit-text-size-adjust: 100%;
      text-rendering: optimizeLegibility;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-weight: 300;
      font-size: 18px;
      line-height: 1.75;
      letter-spacing: -0.01em;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      padding: 1.15rem 2rem;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
    }

    nav .logo {
      font-weight: 500;
      color: var(--accent-color);
      letter-spacing: -0.02em;
    }

    nav a {
      color: var(--text-color);
      margin-left: 1.25rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    nav a:hover { color: var(--accent-color); }

    nav a.active {
      color: var(--accent-color);
      font-weight: 500;
    }

    /* Page header */
    .page-header {
      max-width: 72rem;
      margin: 0 auto;
      padding: 2.75rem 2rem 1.75rem;
    }

    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.25rem;
      color: var(--text-color);
      margin: 0 0 0.6rem;
    }

    .page-header p {
      font-size: 0.9rem;
      color: var(--muted-color);
      margin: 0;
    }

    /* Masonry */
    .masonry {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 2rem 4rem;
      columns: 3;
      column-gap: 0.85rem;
    }

    @media (max-width: 768px) { .masonry { columns: 2; } }
    @media (max-width: 480px) { .masonry { columns: 1; } }

    /* Each photo tile */
    .photo {
      position: relative;
      break-inside: avoid;
      margin-bottom: 0.85rem;
      cursor: zoom-in;
      overflow: hidden;
      border-radius: 4px;

      /* Fade-in initial state */
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .photo.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .photo img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transition: filter 0.35s ease;
    }

    /* Grayscale hover on capable devices */
    @media (hover: hover) and (pointer: fine) {
      .photo img { filter: grayscale(100%); }
      .photo:hover img { filter: grayscale(0%); }
    }

    /* Location label */
    .photo-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem 0.65rem;
      background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      border-radius: 0 0 4px 4px;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .photo:hover .photo-label { opacity: 1; }
    }

    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #lightbox.open { display: flex; }

    #lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      cursor: default;
      user-select: none;
      -webkit-user-drag: none;
      filter: none;
    }

    #lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.65;
      transition: opacity 0.15s;
    }

    #lightbox-close:hover { opacity: 1; }

    @media (max-width: 520px) {
      nav { padding: 1rem 1.25rem; font-size: 15px; }
      nav a { margin-left: 1rem; }
      body { font-size: 17px; line-height: 1.8; }
    }
  </style>
</head>

  <script>

  <script src="/assets/theme.js"></script>

  <script>
    // Inject location labels for photos that have one
    document.querySelectorAll('.photo[data-label]').forEach(function(photo) {
      var label = photo.getAttribute('data-label');
      if (label) {
        var el = document.createElement('span');
        el.className = 'photo-label';
        el.textContent = label;
        photo.appendChild(el);
      }
    });

    // Lightbox
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    const lbClose = document.getElementById('lightbox-close');

    function openLightbox(src, alt) {
      lbImg.src = src;
      lbImg.alt = alt;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    document.querySelectorAll('.photo').forEach(function(photo) {
      photo.addEventListener('click', function() {
        var img = this.querySelector('img');
        openLightbox(img.src, img.alt);
      });
    });

    lb.addEventListener('click', function(e) {
      if (e.target !== lbImg) closeLightbox();
    });

    lbClose.addEventListener('click', closeLightbox);

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });

    // Disable right-click on all images
    document.querySelectorAll('img').forEach(function(img) {
      img.addEventListener('contextmenu', function(e) { e.preventDefault(); });
    });

    // Scroll fade-in, staggered 3 at a time
    var photos = Array.from(document.querySelectorAll('.photo'));

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var idx = photos.indexOf(entry.target);
          entry.target.style.transitionDelay = (idx % 3) * 120 + 'ms';
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08 });

    photos.forEach(function(photo) {
      observer.observe(photo);
    });
  </script>
